<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Intake Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      color: #fff;
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; margin: 12px 0 5px; font-size: 13px; color: #94a3b8; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    #status { margin-top: 15px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>Book a Consultation</h2>
    <form id="leadForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Rahul Sharma" required />

      <label>Phone / WhatsApp</label>
      <input type="tel" id="phone" placeholder="+91 98765 43210" required />

      <label>Requirement</label>
      <input type="text" id="requirement" placeholder="Website / App setup" required />

      <button type="submit" id="submitBtn">Send Inquiry</button>
    </form>
    <div id="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
